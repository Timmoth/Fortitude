name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & unit test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A cold restore is what makes the NuGet audit in Directory.Build.props
      # meaningful: NU1903/NU1904 are promoted to errors, so a dependency with a
      # high or critical advisory fails the build here.
      - name: Restore
        run: dotnet restore Fortitude.sln

      - name: Build
        run: dotnet build Fortitude.sln -c Release --no-restore

      - name: Unit and integration tests
        run: >
          dotnet test Fortitude.Tests/Fortitude.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # The example suite drives a real Aspire host, and builds and runs a Docker image.
      # Container tests skip themselves when no daemon is available; GitHub runners have one,
      # so they do run here.
      - name: Example tests
        run: >
          dotnet test Examples/Fortitude.Example.Tests/Fortitude.Example.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=example-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn
