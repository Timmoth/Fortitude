name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & unit test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A cold restore is what makes the NuGet audit in Directory.Build.props
      # meaningful: NU1903/NU1904 are promoted to errors, so a dependency with a
      # high or critical advisory fails the build here.
      - name: Restore
        run: dotnet restore Fortitude.sln

      - name: Build
        run: dotnet build Fortitude.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test Fortitude.Tests/Fortitude.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn

  # The Examples suite drives real Docker containers (Testcontainers pulls
  # aptacode/fortitude-server) and a .NET Aspire AppHost. It is slower and has
  # external dependencies, so it is manual-trigger only until it is made
  # reliably headless. Tracked as P4-5 in temp/IMPROVEMENT-PLAN.md.
  integration-test:
    name: Docker & Aspire example tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Fortitude.sln

      - name: Test
        run: dotnet test Examples/Fortitude.Example.Tests/Fortitude.Example.Tests.csproj -c Release
