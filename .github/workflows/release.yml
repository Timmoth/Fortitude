name: Release

# Publishes the NuGet package and the multi-arch Docker image.
#
# Trigger by pushing a tag of the form v10.1.3 — the leading "v" is stripped
# for the package version and kept for the Docker tag, matching the convention
# previously used by hand (see NOTES.md).
#
# The package goes to nuget.org via Trusted Publishing and the image to GHCR.
# Neither uses a long-lived credential:
#
#   nuget.org  The job requests a GitHub OIDC token, NuGet/login exchanges it for
#              an API key valid for one hour, and that key does the push. This
#              requires a Trusted Publishing policy on nuget.org naming this
#              repository owner, this repository and the workflow file
#              `release.yml` — see CONTRIBUTING.md.
#   GHCR       The automatic GITHUB_TOKEN authenticates, given packages: write.
#
# No repository secrets are required.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 10.1.3)'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # GHCR requires a lowercase path, so this is spelled out rather than derived
  # from github.repository_owner, which carries the owner's original casing.
  IMAGE: ghcr.io/timmoth/fortitude

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

  nuget:
    name: Publish package to nuget.org
    needs: version
    runs-on: ubuntu-latest

    # id-token lets the job mint the OIDC token that Trusted Publishing trades
    # for a temporary API key. Without it NuGet/login has nothing to exchange.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test before publishing
        run: dotnet test Fortitude.Tests/Fortitude.Tests.csproj -c Release

      # Verifies the package standing on its own before it is published.
      - name: Package tests before publishing
        run: dotnet test Fortitude.Client.Tests/Fortitude.Client.Tests.csproj -c Release

      # PackageVersion is overridden here so the tag is the single source of
      # truth; the value in the csproj is only a local-build fallback.
      - name: Pack
        run: >
          dotnet pack Fortitude.Client/Fortitude.Client.csproj
          -c Release
          -p:PackageVersion=${{ needs.version.outputs.version }}
          -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*

      # Kept immediately before the push on purpose: the key it returns lasts an
      # hour, and each OIDC token buys exactly one key, so requesting it early
      # only risks it expiring behind a slow build.
      - name: Exchange an OIDC token for a nuget.org API key
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile name that owns the package. Public information,
          # and the policy on nuget.org is what actually authorises the push.
          user: aptacode

      # --skip-duplicate so re-running the workflow on an already-published
      # version reports success instead of failing the job. The .snupkg sitting
      # alongside is pushed automatically.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  docker:
    name: Publish Docker image
    needs: version
    runs-on: ubuntu-latest

    # What lets GITHUB_TOKEN push to GHCR; without it the push is a 403.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
