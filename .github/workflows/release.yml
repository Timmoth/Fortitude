name: Release

# Publishes the NuGet package and the multi-arch Docker image.
#
# Trigger by pushing a tag of the form v10.1.3 — the leading "v" is stripped
# for the package version and kept for the Docker tag, matching the convention
# previously used by hand (see NOTES.md).
#
# The package goes to GitHub Packages, not nuget.org. Pushing there needs no
# stored secret: the automatic GITHUB_TOKEN authenticates, given the packages
# write permission granted on the job below.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account with push rights to aptacode/*
#   DOCKERHUB_TOKEN     Docker Hub access token

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 10.1.3)'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE: aptacode/fortitude-server

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

  nuget:
    name: Publish package to GitHub Packages
    needs: version
    runs-on: ubuntu-latest

    # What lets GITHUB_TOKEN push to the registry; without it the push is a 403.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test before publishing
        run: dotnet test Fortitude.Tests/Fortitude.Tests.csproj -c Release

      # Verifies the package standing on its own before it is published.
      - name: Package tests before publishing
        run: dotnet test Fortitude.Client.Tests/Fortitude.Client.Tests.csproj -c Release

      # PackageVersion is overridden here so the tag is the single source of
      # truth; the value in the csproj is only a local-build fallback.
      - name: Pack
        run: >
          dotnet pack Fortitude.Client/Fortitude.Client.csproj
          -c Release
          -p:PackageVersion=${{ needs.version.outputs.version }}
          -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*

      # GitHub Packages rejects a re-push of a version that already exists, so
      # --skip-duplicate keeps a re-run of the workflow from failing the job.
      #
      # Symbol packages (.snupkg) are not supported by GitHub Packages; symbols
      # travel inside the .nupkg instead, via the SourceLink settings in the csproj.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate

  docker:
    name: Publish Docker image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
