name: Feature request
description: Suggest something Fortitude should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to test?
      description: >
        The underlying scenario, not just the API you have in mind. Knowing the problem often
        turns up a simpler answer than the feature as framed.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: A sketch of the API or YAML, if you have one in mind.
      render: csharp

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
      description: Any workaround, or how another mocking tool handles it.
