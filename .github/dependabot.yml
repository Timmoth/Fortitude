version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Microsoft.* and Aspire.* families need to move together or the
      # build breaks on mismatched versions.
      microsoft:
        patterns:
          - 'Microsoft.*'
          - 'System.*'
      aspire:
        patterns:
          - 'Aspire.*'
      test:
        patterns:
          - 'xunit*'
          - 'Testcontainers*'
          - 'coverlet*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
